<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modal Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-md navbar-dark bg-dark md-4" data-bs-theme="dark">
        <span class="navbar-brand px-3">My Site</span>
        <button class="navber navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExample">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarsExample">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Features</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Pricing</a></li>
            </ul>
        </div>
    </nav>
    <div class="container py-5">
        <h1>Modal Form</h1>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#contactModal">Open Contact Form</button>
        <div class="modal fade" id="contactModal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form id="modalForm" class="needs-validation" novalidate>
                        <div class="modal-header">
                            <h5 class="modal-title">Contact</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="name" class="form-label">Name</label>
                                <input type="text" class="form-control" id="name" required>
                                <div class="invalid-feedback">Please enter your name.</div>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>
                                <div class="invalid-feedback">Please enter a valid email.</div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <button type="submit" class="btn btn-primary">Send</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div id="toastPlaceholder" class="position-fixed bottom-0 end-0 p-3" style="z-index:1080"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            var form = document.getElementById('modalForm')
            form.addEventListener('submit', function (e) {
                e.preventDefault()
                if (!form.checkValidity()) {
                    form.classList.add('was-validated')
                    return
                }
                var modalEl = document.getElementById('contactModal')
                var modal = bootstrap.Modal.getInstance(modalEl)
                modal.hide()
                var placeholder = document.getElementById('toastPlaceholder')
                placeholder.innerHTML = '<div class="toast align-items-center text-bg-success border-0 show"><div class="d-flex"><div class="toast-body">Message sent.</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div>'
                form.reset()
                form.classList.remove('was-validated')
            })
        })()
    </script>
</body>

</html>
