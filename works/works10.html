<!DOCTYPE html>
<html>

<head>
    <title> HTML Forms </title>
    <style>
        div.b {
            width: 250px;
            background-color: lavender;
            border-radius: 25px;
            padding: 10px;
            margin: 20px auto;
            display: grid;
            
        }

        .g {
            width: 220px;
        }

        .h {
            font-weight: bolder;
        }

        .abcdefghijklmnopqrstuvwxyz {
            background-color: rgb(2, 101, 36);
            color: aliceblue;
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
            width: 250px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="b" id="b">
        <form id="myForm">

            <label for="fn" class="h"> Full Name: </label><br>
            <input type="text" id="fn" name="fn" class="g"><br>
            <label for="eml" class="h"> Email: </label><br>
            <input type="email" id="eml" name="eml" class="g"><br>
            <label for="age" class="h"> Age: </label><br>
            <input type="number" id="age" name="age" class="g"><br>
            <label for="hbd" class="h"> Date of Birth: </label><br>
            <input type="date" id="hbd" name="hbd" class="g"><br>
            <label for="pswrd" class="h"> Password: </label><br>
            <input type="password" id="pswrd" name="pswrd" class="g"><br>
            <label for="cntry" class="h"> Country: </label><br>
            <select id="cntry" name="cntry" class="g">
                <option value="USA">United States of America</option>
                <option value="UK">United Kingdoms</option>
                <option value="CHNA">China</option>
                <option value="Congo">Democratic Republic of the Congo</option>
                <option value="T&T">Trinidad and Tobago</option>
                <option value="THAILAND!">Thailand</option>
            </select>
            <br> <br>
            <div class="h">Gender:</div>
            <input type="radio" id="M" name="gndr">
            <label for="M"> Male </label><br>
            <input type="radio" id="F" name="gndr">
            <label for="F"> Female </label><br>
            <input type="radio" id="RNBW" name="gndr">
            <label for="RNBW"> LGBTQ+++ </label><br>
            <input type="radio" id="OTHR" name="gndr">
            <label for="OTHR"> Other </label><br>
            <br>
            <div class="h">Interests:</div>
            <input type="checkbox" id="sprt" name="intrsts">
            <label for="sprt"> Sports </label><br>
            <input type="checkbox" id="msc" name="intrsts">
            <label for="msc"> Music </label><br>
            <input type="checkbox" id="rdng" name="intrsts">
            <label for="rdng"> Reading </label><br>
            <input type="checkbox" id="cdng" name="intrsts">
            <label for="cdng"> Coding </label><br><br>
            <label for="msg" class="h"> Message: </label><br>
            <textarea id="msg" name="msg" class="g"> </textarea><br>
            <input type="checkbox" id="agre" name="agre">
            <label for="agre"> I agree to the terms and conditions </label><br>
            <input type="submit" value="Submit Form" class="abcdefghijklmnopqrstuvwxyz"><br>
        </form>
    </div>
    <script>
        const ENDPOINT = 'https://script.google.com/macros/s/AKfycbyYG6ijsylbuCD4nner7ej3Mrl6opCvqxECZ7naywzK0rYKWJDpc5RZipb4axRMZQ2n/exec';

        document.getElementById('myForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const formData = new FormData(this);
            const data = {};

            // Handle checkboxes with multiple values (e.g. interests)
            for (const [key, value] of formData.entries()) {
                if (data[key] !== undefined) {
                    data[key] = [].concat(data[key], value);
                } else {
                    data[key] = value;
                }
            }

            try {
                const response = await fetch(ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(data),
                    redirect: 'follow'
                });
                if (response.ok) {
                    alert('Form submitted successfully!');
                    this.reset();
                } else {
                    alert('Submission failed: ' + response.status);
                }
            } catch (error) {
                alert('Error submitting form: ' + error.message);
            }
        });
    </script>
</body>

</html>
