<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-md navbar-dark bg-dark md-4" data-bs-theme="dark">
        <span class="navbar-brand px-3">My Site</span>
        <button class="navber navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExample">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarsExample">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Features</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Pricing</a></li>
            </ul>
        </div>
    </nav>
    <div class="container py-5">
        <h1>Gallery</h1>
        <div class="row g-3">
            <div class="col-6 col-md-4 col-lg-3"><img class="img-fluid rounded"
                    src="https://picsum.photos/seed/picsum/400/400" data-bs-toggle="modal" data-bs-target="#preview"
                    data-src="https://picsum.photos/seed/picsum/1200/1200" alt="1"></div>
            <div class="col-6 col-md-4 col-lg-3"><img class="img-fluid rounded"
                    src="https://picsum.photos/seed/picsum/400/400" data-bs-toggle="modal" data-bs-target="#preview"
                    data-src="https://picsum.photos/seed/picsum/1200/1200" alt="2"></div>
            <div class="col-6 col-md-4 col-lg-3"><img class="img-fluid rounded"
                    src="https://picsum.photos/seed/picsum/400/400" data-bs-toggle="modal" data-bs-target="#preview"
                    data-src="https://picsum.photos/seed/picsum/1200/1200" alt="3"></div>
            <div class="col-6 col-md-4 col-lg-3"><img class="img-fluid rounded"
                    src="https://picsum.photos/seed/picsum/400/400" data-bs-toggle="modal" data-bs-target="#preview"
                    data-src="https://picsum.photos/seed/picsum/1200/1200" alt="4"></div>
        </div>

        <div class="modal fade" id="preview">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-body p-0 text-center"><img id="previewImg" src="" class="img-fluid" alt="preview">
                    </div>
                    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>

        var preview = document.getElementById('preview')
        preview.addEventListener('show.bs.modal', function(e){
        var trigger =e.relatedTarget
        var src = trigger.getAttribute('data-src')
        document.getElementById('previewImg').src = src
         })
    </script>
</body>

</html>
